name: 🗄️ Database isolation tests

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/check-supabase-migrations.sh"
      - "scripts/run-tenant-isolation-tests.sh"
      - ".github/workflows/database-tests.yml"
  push:
    branches: [develop]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/check-supabase-migrations.sh"
      - "scripts/run-tenant-isolation-tests.sh"
      - ".github/workflows/database-tests.yml"
  workflow_dispatch:

concurrency:
  group: database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tenancy-database:
    name: 🔒 pgTAP tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: latest

      - name: Validate migration versions and build replay manifest
        env:
          MIGRATION_ORDER_OUTPUT: migration-replay-order.txt
        run: bash scripts/check-supabase-migrations.sh

      - name: Start local database and replay all migrations
        run: supabase db start

      - name: Run tenancy database tests
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        shell: bash
        run: |
          set -o pipefail
          bash scripts/run-tenant-isolation-tests.sh 2>&1 | tee tenant-isolation-tests.log

      - name: Publish database validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-validation-${{ github.run_number }}
          path: |
            migration-replay-order.txt
            tenant-isolation-tests.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
