name: Database contract validation

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "src/**/*.contract.test.ts"
      - "scripts/check-supabase-migrations.sh"
      - ".github/workflows/database-tests.yml"
  push:
    branches: [develop]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/check-supabase-migrations.sh"
      - ".github/workflows/database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-contracts:
    name: Static database and tenancy contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate migration inventory
        env:
          MIGRATION_ORDER_OUTPUT: migration-order.txt
        run: bash scripts/check-supabase-migrations.sh
      - name: Run database security contract tests
        run: >-
          npx vitest run
          src/saas/tenantIsolationContract.test.ts
          src/features/apf/apfDatabaseIsolation.contract.test.ts
          src/features/quality/qualityRls.contract.test.ts
          src/features/rbac/rbacGovernance.contract.test.ts
          src/backoffice/backofficeFinancialIntegrity.contract.test.ts
          src/security/releaseWorkflowGuards.contract.test.ts
      - name: Publish validation inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-contract-validation-${{ github.run_number }}
          path: migration-order.txt
          if-no-files-found: warn
          retention-days: 14
