name: Release imutavel

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    name: Validar tag e criar release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do commit tagueado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Extrair versao
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validar origem e versao imutavel da tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_TAG" == "v$RELEASE_VERSION" ]]
          package_version=$(node -p "require('./package.json').version")
          [[ "$package_version" == "$RELEASE_VERSION" ]] || {
            echo "Tag $RELEASE_TAG differs from package.json version $package_version."
            exit 1
          }
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit already promoted to main."
            exit 1
          }

      - name: Gerar changelog
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          body=""
          if [[ -f CHANGELOG.md ]]; then
            body=$(awk "/^## \\[?${RELEASE_TAG#v}\\]?/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          fi
          if [[ -z "$body" ]]; then
            previous=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | sed -n '2p' || true)
            if [[ -n "$previous" ]]; then
              body=$(git log "$previous"..HEAD --pretty=format:"- %s (%h)" --no-merges | head -40)
            else
              body="Primeira release."
            fi
          fi
          printf '%s\n' "$body" > "$RUNNER_TEMP/release_body.md"

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Axionn ${{ steps.version.outputs.tag }}"
          body_path: ${{ runner.temp }}/release_body.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
