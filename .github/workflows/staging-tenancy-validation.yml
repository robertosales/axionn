name: Lovable database handoff validation

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/operations/**"
      - "scripts/check-supabase-migrations.sh"
      - "docs/lovable/**"
      - ".github/workflows/staging-tenancy-validation.yml"

permissions:
  contents: read

jobs:
  validate-handoff:
    name: Validate Lovable handoff package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate migration names and legacy collision allowlist
        env:
          MIGRATION_ORDER_OUTPUT: migration-order.txt
        run: bash scripts/check-supabase-migrations.sh
      - name: Reject remote Supabase mutation commands in workflows
        shell: bash
        run: |
          set -euo pipefail
          remote_cli='supabase (li''nk|db pu''sh|db re''set|migration re''pair|functions de''ploy)'
          linked_flag='--lin''ked'
          if grep -R -nE "$remote_cli|$linked_flag" .github/workflows; then
            echo "Remote Supabase mutations must be executed by Lovable, never by GitHub Actions."
            exit 1
          fi
      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          tracked=$(git ls-files '.env' '.env.local' '.env.*.local' '.env.production' '.env.staging' '.env.e2e')
          if [[ -n "$tracked" ]]; then
            echo "Tracked environment files are forbidden:"
            printf '%s\n' "$tracked"
            exit 1
          fi
      - name: Publish handoff inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lovable-database-handoff-${{ github.run_number }}
          path: migration-order.txt
          if-no-files-found: warn
          retention-days: 14
