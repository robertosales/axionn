name: 🧭 Staging tenancy validation

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply pending migrations to staging before validation"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "Type VALIDATE-ISOLATED-STAGING (or APPLY-ISOLATED-STAGING when applying migrations)"
        required: true
        type: string

concurrency:
  group: staging-tenancy-validation
  cancel-in-progress: false

jobs:
  validate-staging:
    name: Validate staging isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: latest

      - name: Validate migration versions and build replay manifest
        env:
          MIGRATION_ORDER_OUTPUT: migration-replay-order.txt
        run: bash scripts/check-supabase-migrations.sh

      - name: Validate staging secrets and confirmation
        env:
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?Missing SUPABASE_ACCESS_TOKEN}"
          : "${SUPABASE_PROJECT_REF:?Missing SUPABASE_STAGING_PROJECT_REF}"
          : "${SUPABASE_PRODUCTION_PROJECT_REF:?Missing SUPABASE_PRODUCTION_PROJECT_REF}"
          : "${SUPABASE_DB_PASSWORD:?Missing SUPABASE_STAGING_DB_PASSWORD}"
          : "${SUPABASE_STAGING_DB_URL:?Missing SUPABASE_STAGING_DB_URL}"

          if [[ "$SUPABASE_PROJECT_REF" == "$SUPABASE_PRODUCTION_PROJECT_REF" ]]; then
            echo "Refusing to run: staging and production project refs are identical."
            exit 1
          fi

          expected="VALIDATE-ISOLATED-STAGING"
          if [[ "$APPLY_MIGRATIONS" == "true" ]]; then
            expected="APPLY-ISOLATED-STAGING"
          fi
          if [[ "$MIGRATION_CONFIRMATION" != "$expected" ]]; then
            echo "This execution requires the exact confirmation $expected."
            exit 1
          fi

          db_host=$(printf '%s' "$SUPABASE_STAGING_DB_URL" | sed -E 's#^[^:]+://[^@]*@([^:/?]+).*#\1#')
          if [[ -z "$db_host" || "$db_host" == "$SUPABASE_STAGING_DB_URL" ]]; then
            echo "Could not validate the staging database host."
            exit 1
          fi
          if [[ "$db_host" != *"$SUPABASE_PROJECT_REF"* ]]; then
            echo "Staging DB URL host does not match SUPABASE_STAGING_PROJECT_REF."
            exit 1
          fi

      - name: Link staging project
        run: |
          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run 2>&1 | tee migration-dry-run.log

      - name: Apply pending migrations
        if: ${{ inputs.apply_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked 2>&1 | tee migration-apply.log

      - name: Prove tenant isolation against staging
        shell: bash
        run: |
          set -euo pipefail
          supabase test db supabase/tests/database \
            --db-url "$SUPABASE_STAGING_DB_URL" 2>&1 | tee database-isolation.log

      - name: Check pre-enforcement readiness
        shell: bash
        run: |
          set -euo pipefail
          supabase test db supabase/tests/staging/01_pre_enforcement_readiness.test.sql \
            --db-url "$SUPABASE_STAGING_DB_URL" 2>&1 | tee tenancy-readiness.log

      - name: Publish staging validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-tenancy-validation-${{ github.run_number }}
          path: |
            migration-replay-order.txt
            migration-dry-run.log
            migration-apply.log
            database-isolation.log
            tenancy-readiness.log
          if-no-files-found: ignore
          retention-days: 14
